# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: assertive
  review_details: true
  commit_status: true
  auto_review:
    enabled: true
    auto_incremental_review: false
  pre_merge_checks:
    custom_checks:
      - mode: warning
        name: No hardcoded credentials
        instructions: >
          Fail if the PR adds or modifies any hardcoded credential, API key, token,
          password, or secret literal in any file, including source code, config,
          tests, and comments, regardless of whether the value appears to be a demo,
          placeholder, or test value. Pass only if credentials are read at runtime
          from the environment or a secret manager.
  path_instructions:
    - path: "**/*.py"
      instructions: >
        - Treat any string literal assigned to a name containing KEY, TOKEN, SECRET,
          PASSWORD, or CREDENTIAL as a hardcoded credential and flag it as a security
          issue, even if the value looks like a demo, placeholder, or test value.
        - Flag unused imports, unused variables, and dead code as actionable comments.
        - Flag resources opened without a context manager.
        - Flag new modules that are added without corresponding tests under tests/.
